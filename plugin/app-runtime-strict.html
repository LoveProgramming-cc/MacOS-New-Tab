<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Strict plugin security. The JavaScript guards in app-runtime.js can be bypassed (a
     fresh iframe has an untouched fetch), so the real boundary is this policy: no
     network of any kind and no nested frames; workers only from blob: scripts (they inherit
     this policy, so they cannot reach the network either); images/fonts/media only from the
     data:/blob: URLs the host hands out for package assets. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' chrome-extension: 'unsafe-eval'; style-src 'self' chrome-extension: 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'none'; child-src 'none'; worker-src blob:; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plugin Runtime</title>
<link rel="stylesheet" href="sdk/native-ui.css">
<style>
html,body,#app-root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
*{box-sizing:border-box}
#app-root{position:relative}
/* Host drags are latency-sensitive. Keep the app visible but stop generating new
   animation/transition frames until the pointer is released. */
html[data-host-dragging="1"] *,html[data-host-dragging="1"] *::before,html[data-host-dragging="1"] *::after{
  animation-play-state:paused!important;transition-duration:0s!important;scroll-behavior:auto!important;
}
#runtime-error{position:absolute;inset:0;display:none;place-items:center;padding:24px;font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:rgba(20,20,22,.96);color:#fff;text-align:center;white-space:pre-wrap;z-index:2147483647}
</style>
</head>
<body>
<div id="app-root"></div>
<div id="runtime-error"></div>
<script src="app-runtime.js"></script>
</body>
</html>
